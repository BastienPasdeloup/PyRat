##########################################################################################
########################################## INFO ##########################################
##########################################################################################

# This program is needed for an automatic installation of the PyRat software.
# Please refer to the README.md file for more information.

##########################################################################################
######################################## CONTENTS ########################################
##########################################################################################

[project]
name            = "pyrat-game"
version         = "6.4.5"
description     = "PyRat software used in the computer science course at IMT Atlantique"
readme          = "README.md"
license         = "MIT"
requires-python = ">=3.12,<3.14"
authors         = [{name = "Bastien Pasdeloup", email = "bastien.pasdeloup@imt-atlantique.fr"}]
classifiers     = ["Programming Language :: Python",
                   "Programming Language :: Python :: 3.12",
                   "Programming Language :: Python :: 3.13"]
dependencies    = ["pygame",
                   "colored",
                   "distinctipy",
                   "scipy",
                   "tqdm",
                   "matplotlib",
                   "pyfakefs"]

[project.urls]
Homepage      = "https://github.com/BastienPasdeloup/PyRat"
Documentation = "https://bastienpasdeloup.github.io/PyRat"
Issues        = "https://github.com/BastienPasdeloup/PyRat/issues"
PyPI          = "https://pypi.org/project/pyrat-game"
Course        = "https://hub.imt-atlantique.fr/ueinfo-fise1a"

[project.scripts]
pyrat-init = "pyrat.src.workspace:main"

[project.optional-dependencies]
numpy = ["numpy"]
torch = ["torch"]
docs = ["sphinx", "sphinx-autodoc-typehints", "furo", "sphinx-design", "sphinx-copybutton"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.md",
       "LICENSE",
       "MANIFEST.in"]

[build-system]
requires      = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

##########################################################################################
##########################################################################################
